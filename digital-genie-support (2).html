<style>
  :root {
    --federal-blue:  #004CBE;
    --midnight-blue: #00265F;
    --royal-blue:    #0163e6;
    --golden-glow:   #FFA800;
    --ink:           #0f1f3d;
    --muted:         #5b6b86;
    --line:          #e1e8f4;
    --tint:          #eef4ff;
    --bg:            #f3f6fb;
    --white:         #FFFFFF;
    --wa-green:      #25D366;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background:
      linear-gradient(180deg, var(--midnight-blue) 0, var(--federal-blue) 260px, var(--bg) 260px, var(--bg) 100%);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 20px 32px;
    color: var(--ink);
  }

  .card {
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 38, 95, 0.22), 0 2px 8px rgba(0, 38, 95, 0.08);
    width: 100%;
    max-width: 460px;
    overflow: hidden;
  }

  .card-head {
    background: linear-gradient(135deg, var(--federal-blue) 0%, var(--midnight-blue) 100%);
    padding: 30px 28px 26px;
    position: relative;
    color: var(--white);
  }
  .card-head::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, var(--golden-glow), #ffc84d);
  }
  .card-head h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.2px;
  }
  .card-head h1 .accent { color: var(--golden-glow); }
  .card-head p {
    margin-top: 6px;
    font-size: 13.5px;
    color: rgba(255,255,255,.78);
  }

  .card-body { padding: 24px 22px 8px; }

  .stack { display: flex; flex-direction: column; gap: 12px; }

  /* Uniform row buttons */
  .primary {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid var(--line);
    border-left: 4px solid var(--federal-blue);
    border-radius: 12px;
    background: var(--white);
    color: var(--midnight-blue);
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    text-align: left;
    box-shadow: 0 1px 3px rgba(0, 38, 95, 0.06);
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .primary:hover {
    background: var(--tint);
    border-left-color: var(--golden-glow);
    box-shadow: 0 8px 20px rgba(0, 76, 190, 0.14);
    transform: translateY(-2px);
  }
  .primary:active { transform: translateY(0); }
  .primary:focus-visible, .option:focus-visible {
    outline: 3px solid rgba(0, 76, 190, .35);
    outline-offset: 2px;
  }

  .primary .btn-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--federal-blue), var(--royal-blue));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .primary .btn-icon svg { width: 19px; height: 19px; fill: var(--white); }

  .primary .arrow {
    margin-left: auto;
    font-size: 18px;
    color: var(--federal-blue);
    transition: transform .3s ease;
  }
  .primary.open .arrow { transform: rotate(180deg); }
  .primary.open {
    background: var(--tint);
    border-left-color: var(--golden-glow);
  }

  /* WhatsApp chip */
  .feddy .wa-chip {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--wa-green);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .feddy .wa-chip svg { width: 20px; height: 20px; fill: #fff; }

  /* Highlight KYC with gold icon */
  .kyc .btn-icon { background: linear-gradient(135deg, var(--golden-glow), #ffc13b); }
  .kyc .btn-icon svg { fill: var(--midnight-blue); }

  /* Sub-options */
  .options {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .35s cubic-bezier(0.16, 1, 0.3, 1), opacity .3s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-left: 18px;
    margin-top: -4px;
  }
  .options.show { max-height: 180px; opacity: 1; margin-top: 0; }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--tint);
    border: 1px solid var(--line);
    text-decoration: none;
    color: var(--midnight-blue);
    font-size: 14.5px;
    font-weight: 600;
    transition: all .2s ease;
  }
  .option:hover {
    background: var(--white);
    border-color: var(--federal-blue);
    transform: translateX(3px);
  }
  .option .icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--federal-blue); flex-shrink: 0;
  }
  .option .icon svg { width: 16px; height: 16px; fill: var(--white); }
  .option.ios .icon { background: var(--golden-glow); }
  .option.ios .icon svg { fill: var(--midnight-blue); }
  .option .label { line-height: 1.25; }
  .option .label small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
  .option .chev { margin-left: auto; font-size: 18px; color: var(--federal-blue); }

  .footer-credit {
    margin: 22px -22px 0;
    padding: 14px 22px;
    border-top: 1px solid var(--line);
    background: #fafcff;
    text-align: center;
    font-size: 11px;
    color: #8b97ab;
    letter-spacing: .4px;
    text-transform: lowercase;
  }

  @media (max-width: 420px) {
    body { padding-top: 32px; }
    .card-head h1 { font-size: 21px; }
  }

  /* Logo tiles */
  .primary .btn-icon.logo { background: var(--white); border: 1px solid var(--line); padding: 4px; }
  .primary .btn-icon.logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
  .primary .btn-icon.logo svg { fill: var(--federal-blue); }
  .option .icon.store { background: var(--white); border: 1px solid var(--line); }

  .option .icon.store svg { width: 18px; height: 18px; }

  /* ---- Mobile friendliness ---- */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
  .primary, .option { touch-action: manipulation; min-height: 52px; }

  .option { min-height: 48px; }

  @media (max-width: 480px) {

    .primary .btn-icon, .feddy .wa-chip { width: 40px; height: 40px; }
    .options { padding-left: 10px; }
    .option { padding: 10px 12px; font-size: 14.5px; }
    .footer-credit { margin: 18px -14px 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
  }

  @media (max-width: 340px) {
    .card-head h1 { font-size: 20px; }
    .primary { font-size: 14px; }
  }
</style>

<script>
  // Setup accordion toggle helper function
  function setupAccordion(btnId, optionsId) {
    var btn = document.getElementById(btnId);
    var opts = document.getElementById(optionsId);
    
    btn.addEventListener('click', function () {
      var isOpen = opts.classList.toggle('show');
      btn.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }

  setupAccordion('fedBtn', 'platformOptions');
  setupAccordion('fedCorpBtn', 'fedCorpOptions');

  if (window.location.hash === '#open') {
    var options = document.getElementById('platformOptions');
    options.classList.add('show');
    fedBtn.classList.add('open');
    fedBtn.setAttribute('aria-expanded', 'true');
  }

  // Google Analytics click tracking: every link below fires its own named event.
  // Dropdown toggles (Fedmobile / FedCorp) are not tracked.
  document.addEventListener('click', function (event) {
    var link = event.target.closest('a[data-track]');
    if (!link) return;

    if (typeof gtag === 'function') {
      gtag('event', 'button_click', {
        'button_id': link.getAttribute('data-track'),
        'button_text': link.innerText.replace(/\s+/g, ' ').trim(),
        'button_url': link.href
      });
    }
  });
</script>
